<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f0e6">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
    <script src="{{ '/assets/guide.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to the guide</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Agentic Desktop Starter Guide home">
          <span class="wordmark-mark" aria-hidden="true">A</span>
          <span>Agentic Desktop<br>Starter Guide</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}">Start</a>
          <a href="{{ '/handoff/' | relative_url }}">Handoff</a>
          <a href="{{ '/first-project/' | relative_url }}">First project</a>
          <a href="{{ '/safety/' | relative_url }}">Safety</a>
          <a href="{{ '/troubleshooting/' | relative_url }}">Help</a>
        </nav>
      </div>
    </header>

    <main id="content" class="page-shell">
      <article class="guide-content">
        {{ content }}
      </article>
    </main>

    <footer class="site-footer">
      <div>
        <strong>Agentic Desktop Starter Guide</strong>
        <span>Mac and Windows. No command-line experience required.</span>
      </div>
      <div class="footer-links">
        <a href="{{ '/sources/' | relative_url }}">Official sources</a>
        <a href="{{ '/troubleshooting/' | relative_url }}">Get unstuck</a>
      </div>
    </footer>
  </body>
</html>
